<!doctype html><html><head><title>Legacy CU - New Sub-Account</title></head>
<body style="font-family:Tahoma,Arial;background:#eee"><div style="width:760px;margin:30px auto;background:white;padding:20px;border:1px solid #777"><h2>Open New Sub-Account</h2>
{% if error %}<p style="background:#fee;border:1px solid #a33;padding:10px">{{ error }}</p>{% endif %}
<form method="post" action="/member/{{ member_id }}/subaccount/review"><table><tr><td><label>Account Nickname</label></td><td><input name="nickname"></td></tr><tr><td><label>Opening Deposit</label></td><td><input name="deposit" value="0.00"></td></tr><tr><td colspan="2"><button type="submit">Review Account Opening</button></td></tr></table></form>
<p><a href="/">Cancel</a></p></div></body></html>
