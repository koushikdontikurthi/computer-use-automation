<!doctype html><html><head><title>Legacy CU - Member Detail</title>
<style>body{font-family:Tahoma,Arial;background:#e6e6e6;margin:0}.top{background:#15385f;color:white;padding:10px 18px;font-weight:bold}.box{width:820px;margin:20px auto;background:white;border:1px solid #777;padding:18px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border:1px solid #999}th{background:#ddd;text-align:left}</style></head>
<body><div class="top">Community Federal - Member Maintenance</div><div class="box"><h2>Member Detail</h2>
<table><tr><th>Member Number</th><td>{{ member_id }}</td><th>Status</th><td>{{ member.status }}</td></tr><tr><th>Name</th><td colspan="3">{{ member.name }}</td></tr></table>
<h3>Share Accounts</h3><table><tr><th>Account Type</th><th>Current Balance</th></tr><tr><td>Checking</td><td>{{ member.checking }}</td></tr><tr><td>Savings</td><td><span>Current savings balance</span>: <strong>{{ member.savings }}</strong></td></tr></table>
<p><a href="/member/{{ member_id }}/subaccount">Open New Sub-Account</a> | <a href="/">Return to Lookup</a></p>
</div></body></html>
