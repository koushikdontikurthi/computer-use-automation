[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-automation"
version = "0.1.0"
description = "LLM discovery to deterministic computer-use capability replay"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "boto3>=1.34",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "playwright>=1.49",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["evidence*", "tests*", "scripts*", "docs*"]

